{% extends 'base.html' %}

{% block title %}404 Not Found — CYBERTRACE{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; text-align: center;">
    <div class="card" style="border-top: 4px solid var(--accent-amber); padding: 40px 24px;">
        <div style="font-size: 3.5rem; margin-bottom: 12px;">🔍</div>
        <h1 style="font-size: 1.8rem; margin-bottom: 8px; color: #fff;">404 — Endpoint or Dossier Not Found</h1>
        <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.6;">
            The requested case identifier, evidence record, or route does not exist in the local laboratory directory.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to SOC Dashboard</a>
    </div>
</div>
{% endblock %}
